[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkgconfig = 'pkg-config'
exe_wrapper = 'wine64'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '/usr/x86_64-w64-mingw32'
# pkg_config_libdir is set via the PKG_CONFIG_LIBDIR env var by setup-prefix.sh
# and build-win.sh, so no user-specific path is hardcoded here.

[built-in options]
# Target Windows Vista+. aml uses condition variables and WSAPoll, which
# are gated behind _WIN32_WINNT >= 0x0600. MinGW-w64 on Ubuntu 22.04
# defaults below this; declaring it here makes the build reproducible
# regardless of toolchain version.
c_args = ['-D_WIN32_WINNT=0x0600']
